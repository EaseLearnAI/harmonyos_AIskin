name: AppGallery review regression
on: [push, pull_request]
jobs:
  source-and-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --package-lock=false typescript@5.8.3
      - run: python3 scripts/check-appgallery.py
      - run: node --test scripts/tests/*.test.cjs
      - run: git diff --check
